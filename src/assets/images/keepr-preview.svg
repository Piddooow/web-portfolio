<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pgrad_keepr-preview.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131316"/>
      <stop offset="100%" stop-color="#202024"/>
    </linearGradient>
    <pattern id="grid_keepr-preview.svg" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="800" height="500" fill="url(#pgrad_keepr-preview.svg)"/>
  <rect width="800" height="500" fill="url(#grid_keepr-preview.svg)"/>
  
  <!-- Browser / UI Window Frame -->
  <g transform="translate(60, 60)">
    <rect width="680" height="380" rx="12" fill="#121212" stroke="rgba(255,255,255,0.12)" stroke-width="1"/>
    <!-- Window Header -->
    <rect width="680" height="42" rx="12" fill="#1c1c1f"/>
    <rect y="30" width="680" height="12" fill="#1c1c1f"/>
    <circle cx="24" cy="21" r="5" fill="#3f3f46"/>
    <circle cx="42" cy="21" r="5" fill="#3f3f46"/>
    <circle cx="60" cy="21" r="5" fill="#3f3f46"/>
    <rect x="220" y="11" width="240" height="20" rx="6" fill="#121212" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="340" y="25" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="10" text-anchor="middle" letter-spacing="0.5">app.internal.vault</text>
    
    <!-- Content Preview -->
    <g transform="translate(36, 75)">
      <!-- Tag -->
      <rect width="96" height="22" rx="4" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
      <text x="48" y="15" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="9" text-anchor="middle" letter-spacing="1.5">DESKTOP APP</text>
      
      <!-- Title -->
      <text x="0" y="65" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="28" font-weight="300" letter-spacing="-0.5">KeepR Vault v2</text>
      <text x="0" y="96" fill="#71717a" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="13" font-weight="400">Local-first cryptographic secret manager</text>
      
      <!-- Mock UI Cards -->
      <g transform="translate(0, 130)">
        <rect x="0" y="0" width="180" height="110" rx="8" fill="#18181b" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <rect x="16" y="20" width="40" height="6" rx="3" fill="#52525b"/>
        <rect x="16" y="34" width="110" height="8" rx="4" fill="#ffffff"/>
        <rect x="16" y="52" width="140" height="4" rx="2" fill="#3f3f46"/>
        <rect x="16" y="62" width="90" height="4" rx="2" fill="#3f3f46"/>
        <rect x="16" y="82" width="60" height="12" rx="4" fill="#27272a"/>

        <rect x="200" y="0" width="180" height="110" rx="8" fill="#18181b" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <rect x="216" y="20" width="40" height="6" rx="3" fill="#52525b"/>
        <rect x="216" y="34" width="120" height="8" rx="4" fill="#ffffff"/>
        <rect x="216" y="52" width="130" height="4" rx="2" fill="#3f3f46"/>
        <rect x="216" y="62" width="100" height="4" rx="2" fill="#3f3f46"/>
        <rect x="216" y="82" width="60" height="12" rx="4" fill="#27272a"/>

        <rect x="400" y="0" width="208" height="110" rx="8" fill="#18181b" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
        <circle cx="430" cy="55" r="24" fill="#27272a" stroke="rgba(255,255,255,0.1)" stroke-width="2"/>
        <path d="M422 55 L428 61 L440 48" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
        <rect x="470" y="44" width="110" height="8" rx="4" fill="#ffffff"/>
        <rect x="470" y="60" width="80" height="4" rx="2" fill="#52525b"/>
      </g>
    </g>
  </g>
</svg>