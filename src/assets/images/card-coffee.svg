<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="photo_grad_card-coffee.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="vignette_card-coffee.svg" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
  <rect width="500" height="500" fill="url(#photo_grad_card-coffee.svg)"/>
  <rect width="500" height="500" fill="url(#vignette_card-coffee.svg)"/>
  
  <!-- Framing Hairline -->
  <rect x="20" y="20" width="460" height="460" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <!-- Center Graphic -->
  <g transform="translate(250, 210) scale(1.4)">
    <path d="M-30 -10 C-30 30, 30 30, 30 -10 Z" fill="none" stroke="#e4e4e7" stroke-width="3"/>
<path d="M30 -5 C45 -5, 45 15, 30 15" fill="none" stroke="#e4e4e7" stroke-width="3"/>
<line x1="-38" y1="32" x2="38" y2="32" stroke="#e4e4e7" stroke-width="3" stroke-linecap="round"/>
<path d="M-15 -25 C-15 -35, -5 -35, -5 -45 M0 -25 C0 -35, 10 -35, 10 -45" stroke="rgba(255,255,255,0.4)" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  
  <!-- Typography Badge -->
  <g transform="translate(45, 415)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20" font-weight="300" letter-spacing="-0.5">Pour-over & Roasting</text>
    <text x="0" y="24" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="400" letter-spacing="1.2">SINGLE ORIGIN CHEMISTRY</text>
  </g>
</svg>