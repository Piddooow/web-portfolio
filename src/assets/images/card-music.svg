<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="photo_grad_card-music.svg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#27272a"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="vignette_card-music.svg" cx="50%" cy="50%" r="70%">
      <stop offset="40%" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.6"/>
    </radialGradient>
  </defs>
  <rect width="500" height="500" fill="url(#photo_grad_card-music.svg)"/>
  <rect width="500" height="500" fill="url(#vignette_card-music.svg)"/>
  
  <!-- Framing Hairline -->
  <rect x="20" y="20" width="460" height="460" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  
  <!-- Center Graphic -->
  <g transform="translate(250, 210) scale(1.4)">
    <rect x="-40" y="-30" width="80" height="60" rx="6" fill="none" stroke="#e4e4e7" stroke-width="3"/>
<circle cx="-20" cy="-10" r="8" fill="none" stroke="#a1a1aa" stroke-width="2"/>
<circle cx="20" cy="-10" r="8" fill="none" stroke="#a1a1aa" stroke-width="2"/>
<path d="M-30 15 Q-15 0, 0 15 T30 15" fill="none" stroke="#e4e4e7" stroke-width="2.5"/>
  </g>
  
  <!-- Typography Badge -->
  <g transform="translate(45, 415)">
    <text x="0" y="0" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Inter', sans-serif" font-size="20" font-weight="300" letter-spacing="-0.5">Sound & Synthesizers</text>
    <text x="0" y="24" fill="#a1a1aa" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="400" letter-spacing="1.2">ANALOG SIGNAL PROCESSING</text>
  </g>
</svg>